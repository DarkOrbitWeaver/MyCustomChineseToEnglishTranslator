<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 230px; font: 13px Arial, sans-serif; padding: 10px; }
  label, select, button { display: block; width: 100%; margin: 6px 0; }
  label.row { display: flex; align-items: center; gap: 8px; }
  label.row input { width: auto; margin: 0; }
</style>
<label class="row"><input type="checkbox" id="on"> Enable LiveSubs</label>
<label>Prepare ahead
  <select id="ahead">
    <option value="60">1 min</option>
    <option value="180">3 min</option>
    <option value="300">5 min</option>
    <option value="600">10 min</option>
    <option value="900">15 min</option>
  </select>
</label>
<button id="retry">Retry connection</button>
<script src="popup.js"></script>
