<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 270px;
      background: #181818;
      color: #eee;
      font: 13px Roboto, Arial, sans-serif;
      padding: 16px;
    }
    .hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .hdr h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #FFB300, #FF8F00);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #111; font-size: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }
    .toggle {
      appearance: none;
      width: 36px; height: 20px;
      background: #444;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      outline: none;
    }
    .toggle:checked { background: #FFB300; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: .15s;
    }
    .toggle:checked::after { left: 18px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: #252525;
      padding: 3px 8px;
      border-radius: 10px;
      color: #ccc;
    }
    .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
    }
    .dot.ok { background: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
    .dot.err { background: #F44336; }
    .btn-connect {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(135deg, #FFB300, #FF8F00);
      color: #111;
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform .1s;
    }
    .btn-connect:active { transform: scale(0.98); }
    .foot {
      margin-top: 16px;
      font-size: 11px;
      color: #777;
      text-align: center;
      border-top: 1px solid #2a2a2a;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="logo">字</div>
    <h1>LiveSubs</h1>
  </div>
  <div class="row">
    <span>Enable Translation</span>
    <input type="checkbox" id="on" class="toggle">
  </div>
  <div class="row">
    <span>Backend</span>
    <span class="status-badge"><span id="st" class="dot"></span> <span id="st-text">Checking…</span></span>
  </div>
  <button id="btn-conn" class="btn-connect">⚡ Connect to Backend</button>
  <div class="foot">In-player controls & tools on YouTube ▸</div>
  <script src="popup.js"></script>
</body>
</html>
